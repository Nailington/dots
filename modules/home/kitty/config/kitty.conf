# Font Configuration
font_size 12.0
font_family GoogleSans NF

# Window Configuration
window_padding_width 12
background_opacity 1.0
background_blur 32
hide_window_decorations yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
include dank-theme.conf

# Permanent overrides belong after DMS's generated includes.
cursor #f0dfd8
cursor_text_color #d7c2b9

# Keep Kitty's standard ANSI palette; DMS regenerates color0 through color15.
color0  #000000
color1  #cc0403
color2  #19cb00
color3  #cecb00
color4  #0d73cc
color5  #cb1ed1
color6  #0dcdcd
color7  #dddddd
color8  #767676
color9  #f2201f
color10 #23fd00
color11 #fffd00
color12 #1a8fff
color13 #fd28ff
color14 #14ffff
color15 #ffffff
